name: fin
options:
  bundleIdPrefix: dev.levischoen
  deploymentTarget:
    iOS: "17.0"
    # Citadel's package floor is macOS 14, but withPTY/withTTY/withExec (which
    # our session layer depends on unconditionally) are annotated
    # @available(macOS 15.0, *) regardless — a quirk in Citadel itself, not a
    # choice we're making. 15.0 is the real floor for this app on macOS.
    macOS: "15.0"
    visionOS: "26.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.18.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.1
  SwiftNIOSSHFork:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
targets:
  fin:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: fin
      # Shared agent core, extracted for the headless fin-agentd daemon. These files
      # compile directly into the app target (same module, internal access still works);
      # daemon/Package.swift builds the same directory as the FinAgentCore library.
      # Single source of truth — edit there, both products pick it up.
      - path: daemon/Sources/FinAgentCore
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: SwiftNIOSSHFork
        product: NIOSSH
      - package: SwiftNIO
        product: NIO
      - package: SwiftCrypto
        product: Crypto
      # Notification Service Extension (docs/CARPLAY-IMESSAGE-DESIGN.md §3.3):
      # turns a control-plane push into a communication notification so Siri
      # announces Fin's replies in the car. Embedded in the app bundle on every
      # destination of this target; fin-tv deliberately has no such dependency.
      - target: fin-nse
        embed: true
    info:
      path: Generated/Info.plist
      properties:
        # Reference the build settings so a CURRENT_PROJECT_VERSION override at
        # archive time (the testflight scripts' timestamp/auto-increment) actually
        # lands in CFBundleVersion. Without these explicit references XcodeGen bakes
        # the literal current value ("1"), and App Store Connect rejects a re-upload
        # as non-monotonic.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Fin connects to SSH servers on your local network, including this Mac, over a direct TCP connection."
        # CloudKit sync is push-driven between devices: the SwiftData/CloudKit mirror
        # registers a silent-push subscription so a change on one device wakes the
        # others to import it. Without this background mode a second device only pulls
        # on foreground launch — which reads as "stuck syncing" on a device that's
        # rarely opened.
        UIBackgroundModes:
          - remote-notification
        # A custom agent endpoint is very often a plain-HTTP server on the LAN or a
        # Tailscale address (e.g. LM Studio) with no certificate at all — ATS blocks that
        # by default. NSAllowsLocalNetworking only exempts IP-literal hosts and .local
        # domains (there's no hostname for a cert to validate against anyway), not
        # arbitrary internet HTTP, so this doesn't weaken ATS for anything else the app does.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # Required by the Mac App Store validator (LSApplicationCategoryType);
        # harmless/unused on iOS, where App Store Connect handles category via the web UI.
        LSApplicationCategoryType: public.app-category.developer-tools
        # Export-compliance exemption. Fin only uses standard/exempt encryption (HTTPS
        # for SPM package resolution, and SSH's own standard publicly-available crypto
        # for its core client-server protocol) — the same exemption category PocketDJ
        # declares for its HTTPS/TLS usage, evaluated fresh for Fin rather than copied
        # blindly. `false` tells App Store Connect there's no non-exempt encryption, so
        # TestFlight stops asking the per-build "export compliance" question — uploads
        # from scripts/testflight.sh land "Ready to Submit" immediately.
        ITSAppUsesNonExemptEncryption: false
        # Makes the iCloud Drive container's Documents folder show up in Files as
        # "Fin" — where AgentLogMirror drops redacted JSONL audit trails for a
        # Mac-side supervisor to read.
        NSUbiquitousContainers:
          iCloud.dev.levischoen.fin:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: "Fin"
        # Remote-supervision seeds and the Debug auto-session flag, resolved from
        # build settings whose target-level defaults are empty — a normal build
        # carries empty values and every one of these features stays dormant.
        FinDirectiveURL: "$(FIN_DIRECTIVE_URL)"
        FinStatusURL: "$(FIN_STATUS_URL)"
        FinAutoSession: "$(FIN_AUTO_SESSION)"
        # SiriKit in-app intent handling (design §5.2): this is what Xcode's
        # "Supported Intents" section writes for an APP target, and it is what
        # lets Announce Notifications' spoken reply reach
        # FinAppDelegate.application(_:handlerFor:) → FinMessageIntentHandler.
        # INIntentsSupported is the Intents-EXTENSION key and is deliberately
        # not declared — there is no Intents extension.
        NSUserActivityTypes:
          - INSendMessageIntent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.levischoen.fin
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: EC27UF79GL
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Mac App Store / TestFlight distribution requires App Sandbox; iOS's sandbox
        # is implicit, so this is scoped to the macOS SDK only.
        CODE_SIGN_ENTITLEMENTS: fin/fin-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": fin/fin-macOS.entitlements
        # Empty defaults keep the Info.plist's remote-supervision/auto-session keys
        # resolving to "" (dormant) unless a build passes real values.
        FIN_DIRECTIVE_URL: ""
        FIN_STATUS_URL: ""
        FIN_AUTO_SESSION: ""
  fin-nse:
    # Notification Service Extension — docs/CARPLAY-IMESSAGE-DESIGN.md §3.3 step 3
    # and §5.1. A push carrying `fin.agentName` with category fin.reply / fin.input
    # is rewritten into a communication notification (INSendMessageIntent donation
    # with an INPerson "Fin" sender), which is what makes Siri read it aloud in
    # CarPlay / on AirPods and offer a spoken reply. Same three destinations as
    # the app; embedded by the fin target's dependency above. tvOS never gets it.
    type: app-extension
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: fin-nse
      # The intent-building/payload-parsing half is shared verbatim with the app
      # (the app's local banners perform the identical donation, so app-hosted
      # and remote replies look the same). Pure Foundation/Intents/UserNotifications
      # — it must never import anything from the app module.
      - path: fin/Notifications
    info:
      path: Generated/Info-nse.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: "Fin Notifications"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.levischoen.fin.nse
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: EC27UF79GL
        # Version numbers must match the containing app's (App Store validation).
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        # Communication Notifications entitlement; the macOS variant adds the App
        # Sandbox the Mac App Store requires of every embedded extension.
        CODE_SIGN_ENTITLEMENTS: fin/fin-nse.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": fin/fin-nse-macOS.entitlements
  fin-tv:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: fin-tv
      # SwiftTerm's UIKit view layer excludes tvOS, so the headless engine is
      # vendored (MIT, see vendor/SwiftTermEngine/ATTRIBUTION.md) and compiled
      # into this module directly — the iOS/macOS targets keep the upstream
      # SwiftTerm package pin untouched.
      - path: vendor/SwiftTermEngine
      # Synced-schema models shared verbatim with the other platforms (schema
      # parity with finApp's "Synced" ModelConfiguration), plus the theme and
      # device identity. Local-only models (Clipping/Markdown/AgentLog) and the
      # FileDocument shim stay out — their features don't exist on tvOS.
      - path: fin/Models
        includes:
          - Server.swift
          - KeyMetadata.swift
          - Agent.swift
          - AgentMemory.swift
          - AgentSignal.swift
          - AgentRelayMessage.swift
          - RemoteInputPairing.swift
          - AppTheme.swift
          - DeviceIdentity.swift
          - AgentLogKind.swift
      # Screenshot fixtures, so a tvOS capture shows a populated server list
      # rather than the "No Servers Yet" empty state a simulator (no iCloud
      # account) always lands on. Inert unless FIN_SCREENSHOT_MODE=1.
      - path: fin/Support
        includes:
          - ScreenshotFixtures.swift
      - path: fin/Persistence/KeychainStore.swift
      # The key vault (how SSH keys reach a device without iCloud Keychain) and
      # the Sign in with Apple exchange that earns the TV its own session token.
      - path: fin/Vault
      - path: fin/Agent/AppleSignInClient.swift
      # Agent mode: the same transcript lines and turn grouping the iPhone's
      # remote console uses, plus the shared control-key table.
      - path: fin/Agent/AgentMirrorRecord.swift
      - path: fin/Agent/TranscriptTurns.swift
      - path: fin/Terminal/TerminalControlKeys.swift
      - path: daemon/Sources/FinAgentCore/TerminalEventLog.swift
    dependencies:
      - package: Citadel
      - package: SwiftNIOSSHFork
        product: NIOSSH
      - package: SwiftNIO
        product: NIO
      - package: SwiftCrypto
        product: Crypto
    info:
      path: Generated/Info-tvOS.plist
      properties:
        # See the fin target's note — reference the build settings so the
        # testflight-tvos.sh build number lands instead of a baked literal "1".
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: "Fin"
        # CloudKit's silent import pushes wake the mirror, same as iOS.
        UIBackgroundModes:
          - remote-notification
        # Same export-compliance analysis as the iOS target (standard/exempt
        # encryption only: SSH + HTTPS), declared fresh here.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.levischoen.fin
        # Manual App Store signing on the DEVICE SDK only: this account has no
        # registered Apple TV, so automatic signing can't mint a tvOS Development
        # profile at archive time (it needs a device). App Store distribution
        # profiles need no device list — the fin-tv-only scope keeps these settings
        # off the SPM package targets (which reject provisioning profiles) and off
        # the simulator SDK (which signs with nothing). See scripts/testflight-tvos.sh.
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=appletvos*]": "Apple Distribution"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": "Fin tvOS App Store (fin-tv)"
        "CODE_SIGN_IDENTITY[sdk=appletvsimulator*]": ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvsimulator*]": ""
        DEVELOPMENT_TEAM: EC27UF79GL
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_ENTITLEMENTS: fin/fin-tvOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  finTests:
    type: bundle.unit-test
    # Multiplatform on purpose: SwiftUI's macOS backend is a different implementation, so
    # a view that lays out cleanly on iOS can still trap on Mac. Running the same suite on
    # both is the only way those get caught before a user does.
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: finTests
    dependencies:
      - target: fin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.levischoen.fin.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # Simulator/macOS runs don't care, but running the suite on a physical device
        # (the on-device CloudKit diagnostics) needs the test bundle signed too.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: EC27UF79GL
        # The host binary sits at a different path inside the bundle on each platform —
        # flat on iOS, under Contents/MacOS on macOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/fin.app/fin"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/fin.app/Contents/MacOS/fin"
        BUNDLE_LOADER: "$(TEST_HOST)"
  finUITests:
    # macOS-only for now: XCUITest drives the real, running app through its own
    # synchronized accessibility protocol (waitForExistence, hittable checks) rather
    # than generic AppleScript/System Events GUI scripting — the latter proved
    # unreliable mid-investigation (inconsistent element counts, ambiguous
    # same-named-window addressing) for exactly the kind of "does this window stay
    # populated after an interaction" question this exists to answer.
    type: bundle.ui-testing
    # macOS is the primary destination (see above); iOS is supported so the
    # App Store screenshot-capture suite can drive the iPhone/iPad simulators
    # through the same XCUITest path rather than a second, unproven mechanism.
    # Scope any run with -only-testing: — the macOS window tests are not
    # meaningful on iOS.
    supportedDestinations: [macOS, iOS, visionOS]
    sources:
      - path: finUITests
    dependencies:
      - target: fin
    settings:
      # No signing overrides here, deliberately — mirrors PocketDJUITests exactly.
      # This target inherits settings.base's CODE_SIGN_STYLE: Automatic /
      # DEVELOPMENT_TEAM below, which is fine for interactive Xcode runs but
      # unreliable for a headless `xcodebuild test`: this Mac's hardware UDID was
      # never registered for a Mac Development profile ("Device isn't registered
      # in your developer account" / "No profiles found"), and separately the app
      # carries the Push capability (com.apple.developer.aps-environment in
      # fin-macOS.entitlements) which a Mac Development profile wouldn't grant
      # anyway. Real ad-hoc signing (`codesign --sign -`, no profile needed at
      # all) happens purely at the xcodebuild-invocation level in
      # scripts/test-macos.sh (CODE_SIGNING_ALLOWED=NO on build-for-testing, then
      # codesign, then test-without-building) — never here. See
      # .claude/skills/apple-test/SKILL.md.
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.levischoen.fin.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: fin
schemes:
  fin:
    build:
      targets:
        fin: all
        finTests: [test]
        finUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - finTests
        - finUITests
    archive:
      config: Release
